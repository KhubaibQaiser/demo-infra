name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One apply at a time, never cancel a running apply.
concurrency:
  group: demo-infra-apply
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the one-time bootstrap has set repository variables.
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AIVEN_TOKEN: ${{ secrets.AIVEN_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      TF_STATE_PASSPHRASE: ${{ secrets.TF_STATE_PASSPHRASE }}
      TF_VAR_demo_password: ${{ secrets.DEMO_PASSWORD }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_aiven_project: ${{ vars.AIVEN_PROJECT }}
      TF_VAR_render_owner_id: ${{ vars.RENDER_OWNER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate:sites -- --strict
      - run: npm test

      # 1) Platform resources (Pages, Aiven, Render). Must come first: Render's URL feeds the DNS target.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_version: 1.12.5 }
      - name: tofu apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          . scripts/tf-env.sh
          printf 'endpoints = { s3 = "https://%s.r2.cloudflarestorage.com" }\n' "$CLOUDFLARE_ACCOUNT_ID" > tofu/backend.hcl
          tofu -chdir=tofu init -input=false -backend-config=backend.hcl
          tofu -chdir=tofu apply -input=false -auto-approve -lock-timeout=120s

      # 2) DNS (AWS via OIDC, no stored keys).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: npx cdk deploy DemoDns --require-approval never

      # 3) Keep-alive Worker.
      - run: npm run gen:wrangler
      - run: npx wrangler deploy -c keepalive/wrangler.generated.jsonc

      # 4) End-to-end check (retries cover DNS and certificate propagation).
      - name: smoke
        env:
          DEMO_EMAIL: ${{ vars.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          for s in $(node -e 'console.log(require("./sites.json").sites.filter(s=>s.backend).map(s=>s.name).join(" "))'); do
            scripts/smoke.sh "$s"
          done
